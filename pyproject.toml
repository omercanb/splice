[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "splice"
version = "0.1.0"
description = "Compiles a typed subset of Python straight to native C++"
requires-python = ">=3.13"
dependencies = [
    # Must be the mypyc-compiled wheel, not pure-Python or a run may be 4x slower
    # pip install --force-reinstall --only-binary :all: mypy==2.3.0
    "mypy==2.3.0",
    "tabulate>=0.10",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "syrupy>=5.5",
    "numpy>=2.5",
    "tqdm>=4.70",
    "mypy-extensions>=1.1",
    "typing-extensions>=4.16",
]

[tool.setuptools.package-data]
splice = ["runtime/*.h", "py.typed"]
